# Mosquitto di Pi (edge). Template: __BRIDGE_PASSWORD__ dan __CLOUD_HOST__ diisi saat container mulai.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# antrean per klien, termasuk bridge saat cloud tidak terjangkau (4 node x 60 pesan/jam: sekitar 41 jam)
max_queued_messages 10000

# ESP32 dan simulator di jaringan lokal TPS. Akun per node menyusul di #30.
listener 1883
allow_anonymous true

# Bridge TLS ke EMQX di cloud (alur 1)
connection cloud
address __CLOUD_HOST__:8883
remote_clientid pi-tps-1
remote_username pi-bridge
remote_password __BRIDGE_PASSWORD__
bridge_cafile /etc/smarttps/ca.crt
bridge_insecure false
bridge_protocol_version mqttv311
cleansession false
try_private false
restart_timeout 5 30
# keluar ke cloud: data sensor, status node, hasil model AI
topic smarttps/+/data out 1
topic smarttps/+/status out 1
topic smarttps/+/level out 1
# masuk dari cloud: perintah model (tahap 8)
topic smarttps/cmd/# in 1
